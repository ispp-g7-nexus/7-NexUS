sonar.projectKey=nexus
sonar.projectName=NexUS
sonar.sourceEncoding=UTF-8
sonar.scm.provider=git

# Monorepo paths (Django backend + Vite frontend)
sonar.sources=backend,frontend

# Ignore generated, third-party and non-product code
sonar.exclusions=**/__pycache__/**,**/*.pyc,**/migrations/**,**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/.venv/**,**/venv/**,**/tests/**,**/test/**,**/*.test.*,**/*.spec.*,**/docs/**,**/volumes/**,backend/coverage.xml,frontend/public/**,frontend/src/vite-env.d.ts

# Optional quality metric tuning for coverage and duplication calculations
sonar.coverage.exclusions=**/migrations/**,**/__init__.py,backend/manage.py,backend/config/**,frontend/src/main.tsx,frontend/src/vite-env.d.ts
sonar.cpd.exclusions=**/migrations/**,frontend/src/main.tsx

# Coverage reports
sonar.python.version=3.12
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
