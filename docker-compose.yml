services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: nexus_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nexus}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - ./volumes/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: nexus_redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - ./volumes/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        INSTALL_MATCHING: ${INSTALL_MATCHING:-0}
    container_name: nexus_backend
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.local}
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate_schemas --shared --noinput &&
             if [ \"${SEED_DEMO_ON_STARTUP:-1}\" = \"1\" ]; then python manage.py seed_demo; fi &&
             python manage.py migrate_schemas --tenant --noinput &&
             python manage.py runserver 0.0.0.0:8000"

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        INSTALL_MATCHING: ${INSTALL_MATCHING:-0}
    container_name: nexus_celery_worker
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.local}
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A config worker -l info

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        INSTALL_MATCHING: ${INSTALL_MATCHING:-0}
    container_name: nexus_celery_beat
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.local}
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A config beat -l info

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nexus_frontend
    env_file:
      - .env
    environment:
      NODE_ENV: development
      PORT: ${FRONTEND_PORT:-5173}
      INTERNAL_API_BASE_URL: ${INTERNAL_API_BASE_URL:-http://backend:8000}
      JWT_ACCESS_COOKIE_NAME: ${JWT_ACCESS_COOKIE_NAME:-access_token}
      VITE_JWT_ACCESS_COOKIE_NAME: ${VITE_JWT_ACCESS_COOKIE_NAME:-access_token}
      VITE_DISABLE_HMR: ${VITE_DISABLE_HMR:-0}
      VITE_USE_POLLING: ${VITE_USE_POLLING:-1}
    volumes:
      - ./frontend:/app
      - ./volumes/frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    command: >
      sh -c "npm ci && npm run dev -- --host"

  tenant_gateway:
    build:
      context: ./tenant-gateway
      dockerfile: Dockerfile
    container_name: nexus_tenant_gateway
    env_file:
      - .env
    environment:
      PORT: 3000
      FRONTEND_UPSTREAM_URL: ${FRONTEND_UPSTREAM_URL:-http://frontend:5173}
      BACKEND_UPSTREAM_URL: ${BACKEND_UPSTREAM_URL:-http://backend:8000}
      TENANT_CONTEXT_HOST: ${TENANT_CONTEXT_HOST:-${DEMO_TENANT_DOMAIN:-demo.nexus.local}}
      TENANT_CONTEXT_PATH: ${TENANT_CONTEXT_PATH:-/api/public/tenant-context/}
      TENANT_BOOTSTRAP_GLOBAL: ${TENANT_BOOTSTRAP_GLOBAL:-__NEXUS_DATA__}
      REQUEST_TIMEOUT_MS: ${TENANT_GATEWAY_TIMEOUT_MS:-5000}
    depends_on:
      - frontend
      - backend

  nginx:
    image: nginx:1.27-alpine
    container_name: nexus_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - tenant_gateway
