services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: nexus_postgres_prod
    env_file:
      - .env.prod
    volumes:
      - nexus_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: nexus_redis_prod
    command: redis-server --appendonly yes
    volumes:
      - nexus_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    image: ghcr.io/${GHCR_OWNER:-ispp-g7-nexus}/nexus-backend:${IMAGE_TAG:-dev}
    pull_policy: always
    container_name: nexus_backend_prod
    env_file:
      - .env.prod
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      MATCHING_ENABLED: "1"
      SEED_DEMO_ON_STARTUP: 0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate_schemas --shared --noinput &&
             python manage.py migrate_schemas --tenant --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers $${GUNICORN_WORKERS:-3} --timeout $${GUNICORN_TIMEOUT:-120}"
    restart: unless-stopped

  celery_worker:
    image: ghcr.io/${GHCR_OWNER:-ispp-g7-nexus}/nexus-worker:${IMAGE_TAG:-dev}
    pull_policy: always
    container_name: nexus_celery_worker_prod
    env_file:
      - .env.prod
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      MATCHING_ENABLED: "1"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A config worker -l info --concurrency=$${CELERY_WORKER_CONCURRENCY:-1}
    restart: unless-stopped

  celery_beat:
    image: ghcr.io/${GHCR_OWNER:-ispp-g7-nexus}/nexus-worker:${IMAGE_TAG:-dev}
    pull_policy: always
    container_name: nexus_celery_beat_prod
    env_file:
      - .env.prod
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      MATCHING_ENABLED: "1"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A config beat -l info
    restart: unless-stopped

  frontend:
    image: ghcr.io/${GHCR_OWNER:-ispp-g7-nexus}/nexus-frontend:${IMAGE_TAG:-dev}
    pull_policy: always
    container_name: nexus_frontend_prod
    env_file:
      - .env.prod
    environment:
      NODE_ENV: production
    depends_on:
      - backend
    command: >
      sh -c "npm run build &&
             npm run preview -- --host --port 5173"
    restart: unless-stopped

  tenant_gateway:
    image: ghcr.io/${GHCR_OWNER:-ispp-g7-nexus}/nexus-tenant-gateway:${IMAGE_TAG:-dev}
    pull_policy: always
    container_name: nexus_tenant_gateway_prod
    env_file:
      - .env.prod
    environment:
      PORT: 3000
      FRONTEND_UPSTREAM_URL: http://frontend:5173
      BACKEND_UPSTREAM_URL: http://backend:8000
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: nexus_nginx_prod
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - tenant_gateway
    restart: unless-stopped

volumes:
  nexus_postgres_data:
  nexus_redis_data:
