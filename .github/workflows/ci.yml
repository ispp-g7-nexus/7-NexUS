name: CI

on:
  pull_request:
    branches:
      - main
      - develop
      - "sprint/**"
      - "release/**"
      - "hotfix/**"
  push:
    branches:
      - main
      - develop
      - "sprint/**"
      - "release/**"
      - "hotfix/**"

jobs:
  backend-checks:
    name: Backend checks
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: config.settings.local
      DJANGO_SECRET_KEY: ci-secret-key
      DJANGO_DEBUG: "1"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend,nginx,.nexus.local
      DJANGO_CSRF_TRUSTED_ORIGINS: http://localhost,http://127.0.0.1
      POSTGRES_DB: nexus
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements/local.txt

      - name: Django system check
        working-directory: backend
        run: python manage.py check

      - name: Python compile check
        run: python -m compileall backend

  frontend-checks:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build SSR app
        working-directory: frontend
        run: npm run build

  compose-validate:
    name: Docker Compose validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare CI env file
        shell: bash
        run: |
          if [ -f .env.local.example ]; then
            cp .env.local.example .env
          elif [ -f .env.example ]; then
            cp .env.example .env
          else
            echo "No se encontro plantilla de entorno (.env.local.example o .env.example)."
            exit 1
          fi

      - name: Validate dev compose
        run: docker compose -f docker-compose.yml config

      - name: Validate prod compose
        run: docker compose -f docker-compose.prod.yml config
