name: CI Frontend

on:
  pull_request:
    branches:
      - main
      - develop
      - "sprint*"
      - "release/**"
      - "hotfix/**"
  push:
    branches:
      - main
      - develop
      - "sprint*"
      - "release/**"
      - "hotfix/**"

jobs:
  frontend-checks:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend app
        working-directory: frontend
        run: npm run build
