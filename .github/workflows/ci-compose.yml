name: CI Compose

on:
  pull_request:
    branches:
      - main
      - develop
      - "sprint/**"
      - "release/**"
      - "hotfix/**"
  push:
    branches:
      - main
      - develop
      - "sprint/**"
      - "release/**"
      - "hotfix/**"

jobs:
  compose-validate:
    name: Docker Compose validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare CI env files
        shell: bash
        run: |
          if [ -f .env.local.example ]; then
            cp .env.local.example .env
          elif [ -f .env.example ]; then
            cp .env.example .env
          else
            echo "No se encontro plantilla de entorno (.env.local.example o .env.example)."
            exit 1
          fi

          if [ -f .env.prod.example ]; then
            cp .env.prod.example .env.prod
          elif [ -f .env.example ]; then
            cp .env.example .env.prod
          else
            echo "No se encontro plantilla de entorno para produccion (.env.prod.example o .env.example)."
            exit 1
          fi

      - name: Validate dev compose
        run: docker compose -f docker-compose.yml config

      - name: Validate prod compose
        run: docker compose -f docker-compose.prod.yml config
