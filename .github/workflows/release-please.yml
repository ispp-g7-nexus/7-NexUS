name: Release Please

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Open release PR on develop
    if: ${{ secrets.RELEASE_PLEASE_TOKEN != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Run release-please
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          release-type: simple
          target-branch: develop
          package-name: nexus

  release-please-not-configured:
    name: Release Please not configured
    if: ${{ secrets.RELEASE_PLEASE_TOKEN == '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Show configuration hint
        run: |
          {
            echo "### Release Please desactivado"
            echo "- Falta el secreto \`RELEASE_PLEASE_TOKEN\`."
            echo "- Crea un PAT con permisos de repo (contents + pull requests) y guardalo como secreto."
            echo "- Alternativamente, habilita 'Allow GitHub Actions to create and approve pull requests' y ajusta este workflow para usar GITHUB_TOKEN."
          } >> $GITHUB_STEP_SUMMARY
