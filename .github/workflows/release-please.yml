name: Release Please

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    env:
      RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
    steps:
      - name: Show configuration hint
        if: ${{ env.RELEASE_PLEASE_TOKEN == '' }}
        run: |
          {
            echo "### Release Please desactivado"
            echo "- Falta el secreto \`RELEASE_PLEASE_TOKEN\`."
            echo "- Crea un PAT con permisos de repo (contents + pull requests) y guardalo como secreto."
            echo "- Alternativamente, habilita 'Allow GitHub Actions to create and approve pull requests' y ajusta este workflow para usar GITHUB_TOKEN."
          } >> $GITHUB_STEP_SUMMARY

      - name: Run release-please
        if: ${{ env.RELEASE_PLEASE_TOKEN != '' }}
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ env.RELEASE_PLEASE_TOKEN }}
          release-type: simple
          target-branch: develop
          package-name: nexus
