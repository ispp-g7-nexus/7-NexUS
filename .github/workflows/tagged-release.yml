name: Tagged Release Pipeline

on:
  push:
    tags:
      - "dev-v*"
      - "stg-v*"
      - "pre-v*"
      - "v*"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-publish:
    name: Build and publish images
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.meta.outputs.environment }}
      version: ${{ steps.meta.outputs.version }}
      tag_name: ${{ steps.meta.outputs.tag_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve tag metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          TAG="${GITHUB_REF_NAME}"

          if [[ "${TAG}" =~ ^dev-v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            ENVIRONMENT="dev"
            VERSION="${BASH_REMATCH[1]}"
          elif [[ "${TAG}" =~ ^stg-v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            ENVIRONMENT="stg"
            VERSION="${BASH_REMATCH[1]}"
          elif [[ "${TAG}" =~ ^pre-v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            ENVIRONMENT="pre"
            VERSION="${BASH_REMATCH[1]}"
          elif [[ "${TAG}" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            ENVIRONMENT="prod"
            VERSION="${BASH_REMATCH[1]}"
          else
            echo "Tag no valido para golden flow: ${TAG}"
            exit 1
          fi

          echo "environment=${ENVIRONMENT}" >> "${GITHUB_OUTPUT}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tag_name=${TAG}" >> "${GITHUB_OUTPUT}"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/nexus-backend:${{ steps.meta.outputs.tag_name }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/nexus-backend:${{ steps.meta.outputs.environment }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/nexus-backend:sha-${{ github.sha }}

      - name: Build and push worker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/nexus-worker:${{ steps.meta.outputs.tag_name }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/nexus-worker:${{ steps.meta.outputs.environment }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/nexus-worker:sha-${{ github.sha }}

      - name: Build and push frontend SSR image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/nexus-frontend-ssr:${{ steps.meta.outputs.tag_name }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/nexus-frontend-ssr:${{ steps.meta.outputs.environment }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/nexus-frontend-ssr:sha-${{ github.sha }}

      - name: Summary
        run: |
          {
            echo "### Release por tag"
            echo "- Tag: \`${{ steps.meta.outputs.tag_name }}\`"
            echo "- Entorno: \`${{ steps.meta.outputs.environment }}\`"
            echo "- Version: \`${{ steps.meta.outputs.version }}\`"
          } >> $GITHUB_STEP_SUMMARY

  deploy-webhook:
    name: Deploy via webhook (optional)
    runs-on: ubuntu-latest
    needs: build-and-publish
    if: always()
    steps:
      - name: Trigger DEV deploy webhook
        if: needs.build-and-publish.outputs.environment == 'dev' && secrets.DEPLOY_WEBHOOK_DEV != ''
        run: |
          curl -sS -X POST "${{ secrets.DEPLOY_WEBHOOK_DEV }}" \
            -H "Content-Type: application/json" \
            -d "{\"tag\":\"${{ needs.build-and-publish.outputs.tag_name }}\",\"sha\":\"${{ github.sha }}\"}"

      - name: Trigger STG deploy webhook
        if: needs.build-and-publish.outputs.environment == 'stg' && secrets.DEPLOY_WEBHOOK_STG != ''
        run: |
          curl -sS -X POST "${{ secrets.DEPLOY_WEBHOOK_STG }}" \
            -H "Content-Type: application/json" \
            -d "{\"tag\":\"${{ needs.build-and-publish.outputs.tag_name }}\",\"sha\":\"${{ github.sha }}\"}"

      - name: Trigger PRE deploy webhook
        if: needs.build-and-publish.outputs.environment == 'pre' && secrets.DEPLOY_WEBHOOK_PRE != ''
        run: |
          curl -sS -X POST "${{ secrets.DEPLOY_WEBHOOK_PRE }}" \
            -H "Content-Type: application/json" \
            -d "{\"tag\":\"${{ needs.build-and-publish.outputs.tag_name }}\",\"sha\":\"${{ github.sha }}\"}"

      - name: Trigger PROD deploy webhook
        if: needs.build-and-publish.outputs.environment == 'prod' && secrets.DEPLOY_WEBHOOK_PROD != ''
        run: |
          curl -sS -X POST "${{ secrets.DEPLOY_WEBHOOK_PROD }}" \
            -H "Content-Type: application/json" \
            -d "{\"tag\":\"${{ needs.build-and-publish.outputs.tag_name }}\",\"sha\":\"${{ github.sha }}\"}"

      - name: No webhook configured
        if: |
          (needs.build-and-publish.outputs.environment == 'dev' && secrets.DEPLOY_WEBHOOK_DEV == '') ||
          (needs.build-and-publish.outputs.environment == 'stg' && secrets.DEPLOY_WEBHOOK_STG == '') ||
          (needs.build-and-publish.outputs.environment == 'pre' && secrets.DEPLOY_WEBHOOK_PRE == '') ||
          (needs.build-and-publish.outputs.environment == 'prod' && secrets.DEPLOY_WEBHOOK_PROD == '')
        run: |
          echo "No hay webhook configurado para el entorno ${{ needs.build-and-publish.outputs.environment }}."
