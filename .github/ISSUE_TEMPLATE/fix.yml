name: "🔧 Fix"
description: "Reportar un error o bug para corregir"
title: "[NX-SZ.YY] "
labels: ["Bug"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        # 🔧 Reportar un error
        ---

  - type: textarea
    id: descripcion
    attributes:
      label: "📝 Descripción del error"
      placeholder: |
        Ejemplo:
        Los avisos no aparecen en el panel
    validations:
      required: true

  - type: dropdown
    id: modulo
    attributes:
      label: "📍 Módulo / Área de la aplicación"
      description: "Selecciona el módulo donde ocurre el error"
      options:
        - "Panel admin"
        - "Autenticación"
        - "Avisos"
        - "Eventos"
        - "Incidencias"
        - "Matching"
        - "Onboarding"
        - "Infraestructura"
        - "Espacios comunes"
        - "Objetos"
        - "Diseño UX/UI"
        - "Calidad"
        - "Documentación"
        - "Presentación"
        - "➕Otro (especificar)"
    validations:
      required: true

  - type: input
    id: otro-modulo
    attributes:
      label: "➕ 'Otro':"
      placeholder: "Ejemplo: Comunicación usuarios pilotos"
    validations:
      required: false

  - type: dropdown
    id: prioridad
    attributes:
      label: "⚠️ Prioridad"
      description: "¿Qué tan urgente es este error?"
      options:
        - "🔥 Crítico - Bloquea y no se puede trabajar"
        - "🔴 Alta - Funcionalidad principal rota"
        - "🟡 Media - Error molesto pero tiene solución alternativa"
        - "🟢 Baja - Error menor / UI / Texto"
    validations:
      required: true

  - type: textarea
    id: info-adicional
    attributes:
      label: "📸 Adjunta información adicional (capturas, mensajes de error)"
      placeholder: "Mensajes de error, capturas de pantalla"
    validations:
      required: false


  - type: dropdown
    id: sprint
    attributes:
      label: "🔔 Entrega correspondiente"
      description: "Selecciona en qué entrega se corrige este error"
      options:
        - "DP"
        - "Sprint 1"
        - "Sprint 2"
        - "Sprint 3"
        - "PPL"
    validations:
      required: true