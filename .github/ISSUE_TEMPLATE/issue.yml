name: "📋 Nueva tarea"
description: "Crear una nueva tarea"
title: "[TAREA] "
labels: ["Issue"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        # 📋 Tarea
        ---

  - type: textarea
    id: descripcion
    attributes:
      label: "🔍 Descripción"
      description: "Explica detalladamente información sobre la tarea"
      placeholder: |
        Ejemplo:
        Necesitamos implementar la autenticación para facilitar el registro de usuarios.
    validations:
      required: true

  - type: dropdown
    id: modulo
    attributes:
      label: "📍 Módulo / Área de la aplicación"
      description: "Selecciona el módulo al que pertenece esta tarea"
      options:
        - "Panel admin"
        - "Autenticación"
        - "Avisos"
        - "Eventos"
        - "Incidencias"
        - "Matching"
        - "Onboarding"
        - "Infraestructura"
        - "Espacios comunes"
        - "Objetos"
        - "Diseño UX/UI"
        - "Calidad"
        - "Documentación"
        - "Presentación"
        - "➕ Otro (especificar)"
    validations:
      required: true

  - type: input
    id: otro-modulo
    attributes:
      label: "➕ 'Otro':"
      placeholder: "Ejemplo: Comunicación usuarios pilotos"
    validations:
      required: false

  - type: dropdown
    id: prioridad
    attributes:
      label: "⚠️ Prioridad"
      description: "¿Qué prioridad tiene esta tarea?"
      options:
        - "🔥 Urgente - Bloquea otras tareas / Urgente"
        - "🔴 Alta - Debería hacerse lo antes posible"
        - "🟡 Media - Importante pero no urgente"
        - "🟢 Baja - Detalle menor"
    validations:
      required: true

  - type: dropdown
    id: sprint
    attributes:
      label: "🔔 Entrega correspondiente"
      description: "Selecciona en qué entrega se planifica esta tarea"
      options:
        - "DP"
        - "Sprint 1"
        - "Sprint 2"
        - "Sprint 3"
        - "PPL"
    validations:
      required: true